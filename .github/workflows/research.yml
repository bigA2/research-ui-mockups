name: research
on:
  workflow_dispatch: {}
permissions:
  contents: write
  models: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Research with GitHub Models (free tier, no stored keys)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 research.py
      - uses: actions/upload-artifact@v4
        with: { name: report, path: out/REPORT.md }
      - name: Save report
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add out/REPORT.md && git commit -m "research report $(date -u +%F-%H%M)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
